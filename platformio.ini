; =============================================================================
; PlatformIO Project Configuration
; Project: RTOS-Based Sensor Hub with Runtime Task Health Monitoring
; Target:  ESP32 DevKit V1
; =============================================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor baud rate (must match Serial.begin() in main.cpp)
monitor_speed = 115200

; Upload speed
upload_speed = 921600

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0        ; Suppress ESP-IDF debug output
    -DARDUINO_RUNNING_CORE=1    ; Run Arduino loop on core 1
    -DARDUINO_EVENT_RUNNING_CORE=1

; FreeRTOS is built into the ESP32 Arduino framework — no extra library needed.
; The DHT sensor library is added here:
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; Extra include paths
build_src_filter = +<*>

; Wokwi simulation: use wokwi.toml to point to this config
